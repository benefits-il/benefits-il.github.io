<style>
  :root{ --canvas:#FFFBEB; --paper:#FFFFFF; --ink:#0F172A; --anchor:#047857; --ui-green:#10B981;
    --depth:#064E3B; --green-mint:#6EE7B7; --sunshine:#FCD34D; --coral:#FB7185; --lavender:#A78BFA; --sky:#38BDF8; }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ font-family:'Varela Round', system-ui, sans-serif; background:var(--depth); color:#fff;
    min-height:100vh; display:grid; place-items:center; padding:32px; overflow:hidden; position:relative; }
  .glow{ position:absolute; inset:-15%; z-index:0; pointer-events:none;
    background-image:radial-gradient(circle at 25% 30%, rgba(16,185,129,.30) 0, transparent 42%),
                     radial-gradient(circle at 78% 72%, rgba(167,139,250,.20) 0, transparent 44%); }
  .grain{ position:absolute; inset:0; opacity:.5; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.10) 1.4px, transparent 1.5px); background-size:26px 26px; }
  .deco{ position:absolute; z-index:0; pointer-events:none; }
  .card{ position:relative; z-index:2; text-align:center; max-width:560px; }
  .logo{ width:78px; height:78px; margin:0 auto 26px; background:var(--canvas); display:grid; place-items:center;
    border:3px solid var(--ink); border-radius:20px; box-shadow:6px 6px 0 0 rgba(0,0,0,.4); }
  .logo svg{ width:42px; height:52px; color:var(--anchor); display:block; }
  .code{ font-family:'Rubik'; font-weight:900; font-size:clamp(80px,20vw,150px); line-height:.9; letter-spacing:-5px; color:#fff; direction:ltr; margin:0; }
  .code .stamp{ display:inline-block; background:var(--sunshine); color:var(--ink); padding:0 14px; border:5px solid var(--ink);
    border-radius:18px; box-shadow:8px 8px 0 0 rgba(0,0,0,.45); transform:rotate(-3deg); }
  h1{ font-family:'Rubik'; font-weight:900; font-size:clamp(26px,5vw,38px); letter-spacing:-1px; margin:22px 0 10px; color:#fff; }
  p{ font-size:19px; color:rgba(255,255,255,.82); margin:0 0 30px; line-height:1.55; }
  .btn{ display:inline-flex; align-items:center; gap:10px; background:var(--sunshine); color:var(--ink);
    border:3px solid var(--ink); border-radius:999px; padding:16px 34px; font-family:'Rubik'; font-weight:800; font-size:19px;
    text-decoration:none; box-shadow:0 7px 0 0 var(--ink); transition:transform .15s, box-shadow .15s; }
  .btn:hover{ transform:translateY(-3px); box-shadow:0 10px 0 0 var(--ink); }
  .btn:active{ transform:translateY(3px); box-shadow:0 3px 0 0 var(--ink); }
  :is(a):focus-visible{ outline:3px solid var(--sunshine); outline-offset:3px; border-radius:10px; }
  @media (prefers-reduced-motion: no-preference){
    @keyframes breathe{ 0%{ transform:scale(1); opacity:.85; } 100%{ transform:scale(1.12); opacity:1; } }
    .glow{ animation:breathe 9s ease-in-out infinite alternate; }
    @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-14px); } }
    .deco{ animation:floaty var(--fdur,7s) ease-in-out infinite; }
  }
</style>
</head>

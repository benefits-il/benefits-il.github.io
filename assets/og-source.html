<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#FFFBEB; --ink:#0F172A; --anchor:#047857; --depth:#064E3B;
    --green-mint:#6EE7B7; --sunshine:#FCD34D; --coral:#FB7185; --lavender:#A78BFA; --sky:#38BDF8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; }
  body{ font-family:'Rubik', system-ui, sans-serif; }

  .card{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:var(--depth); color:#fff;
  }
  /* radial glows — same palette as hero, tuned for the card frame */
  .glow{ position:absolute; inset:-12%; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(circle at 16% 24%, rgba(16,185,129,.34) 0, transparent 42%),
      radial-gradient(circle at 86% 78%, rgba(167,139,250,.24) 0, transparent 44%),
      radial-gradient(circle at 62% 8%, rgba(252,211,77,.15) 0, transparent 40%); }
  /* dotted grain */
  .grain{ position:absolute; inset:0; z-index:1; opacity:.5; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.10) 1.4px, transparent 1.5px); background-size:26px 26px; }

  /* Memphis deco — restrained, in the corners */
  .deco{ position:absolute; z-index:2; pointer-events:none; }
  .d-coral{ top:56px; right:474px; width:50px; height:50px; border-radius:50%;
    background:var(--coral); border:4px solid var(--ink); }
  .d-sky{ bottom:38px; left:64px; width:44px; height:44px;
    background:var(--sky); border:4px solid var(--ink); transform:rotate(18deg); }
  .d-sun{ bottom:50px; left:170px; width:20px; height:20px; border-radius:50%;
    background:var(--sunshine); border:3px solid var(--ink); }

  /* ── brand lockup, top-left (full signature scale) ── */
  .brand{ position:absolute; top:42px; left:52px; z-index:5;
    display:flex; align-items:center; gap:22px; }
  .brand__logo{ width:92px; height:92px; flex:none; background:var(--canvas);
    display:grid; place-items:center; border:3px solid var(--canvas); border-radius:22px;
    box-shadow:5px 5px 0 0 rgba(0,0,0,.35); }
  .brand__logo svg{ width:50px; height:64px; color:var(--anchor); display:block; }
  .brand__name{ font-weight:900; font-size:56px; letter-spacing:-1px; color:#fff; line-height:1; }

  /* ── left typography block ── */
  .type{ position:absolute; z-index:4; left:56px; top:52%; transform:translateY(-50%);
    width:660px; }
  .type h1{ font-weight:900; font-size:80px; line-height:.96; letter-spacing:-3px; color:#fff; }
  .type h1 .star{ color:var(--sunshine); font-size:.82em; letter-spacing:0;
    display:inline-block; transform:translateY(-4px); margin-right:6px; }
  .type h1 .stamp{ display:inline-block; background:var(--sunshine); color:var(--ink);
    padding:0 18px 5px; border:5px solid var(--ink); border-radius:20px;
    box-shadow:7px 7px 0 0 rgba(0,0,0,.45); transform:rotate(-2.5deg); margin-top:10px; }
  .squiggle{ display:block; margin:30px 0 0 4px; width:320px; height:32px;
    color:var(--green-mint); overflow:visible; }
  .squiggle path{ fill:none; stroke:currentColor; stroke-width:7; stroke-linecap:round; }
  .byline{ margin:28px 0 0 4px; font-family:'JetBrains Mono', monospace; font-weight:600;
    font-size:42px; letter-spacing:.5px; color:#fff; }
  .byline .plant{ font-family:'Segoe UI Emoji','JetBrains Mono',sans-serif; font-size:44px; margin-left:14px; }

  /* ── Benjamin snap: half-body, large, bottom-cropped ── */
  .snap{ position:absolute; z-index:3; right:50px; top:30px; height:950px; width:auto; display:block; }
  /* white sparkle ON the snap point (thumb+middle fingertips) */
  .snap-star{ position:absolute; z-index:6; left:827px; top:103px; width:44px; height:44px; color:#fff;
    filter:drop-shadow(0 0 9px rgba(255,255,255,.8)); }
  .snap-star svg{ display:block; width:100%; height:100%; }
</style>
</head>
